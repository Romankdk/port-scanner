[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portscan"
version = "0.1.0"
description = "TCP port scanner with banner grabbing and risk notes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
portscan = "portscan.__main__:main"

[tool.setuptools]
packages = ["portscan"]
